# Alembic: database migrations (checklist O5). The database address comes from DATABASE_URL (src/app/config.py).
#   uv run alembic upgrade head                      apply all migrations
#   uv run alembic revision --autogenerate -m "..."  new migration after changing a model (review it before committing)
#   uv run alembic downgrade -1                      undo the last migration
[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
