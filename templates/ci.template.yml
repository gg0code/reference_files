# ci.template.yml - kit template, version v2.2
#
# scaffold.sh turns this into .github/workflows/ci.yml for the stack you name:
#   bash scaffold.sh <app> node|python|go|rust
# It uncomments the lines between the matching #>>> STACK and #<<< STACK markers.
# To do it by hand: copy this file to .github/workflows/ci.yml and remove the leading "# "
# from the lines inside ONE stack block.
#
# Philosophy, identical for every stack:
# - Run the FULL regression suite on every PR and every push to main, never only the new tests.
#   A branch suite proves the new REQ works; only the full suite proves earlier REQ-IDs still work.
# - The doc-lint belongs inside the test command (docs/RULES.md section 3), so it runs here too.
# - The traceability step fails the build if a merged REQ-ID has no test files.
# - The job is named "test"; branch protection requires that check (see runbook.md Phase 2c).
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the traceability check can read merged REQ commits

      # Node / npm
      #>>> STACK:node
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #     cache: 'npm'
      # - name: Install
      #   run: npm ci
      # - name: Full regression suite
      #   run: npm test
      #<<< STACK:node

      # Python / pytest (pyproject.toml with a [dev] extra, or requirements.txt)
      #>>> STACK:python
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      #     cache: 'pip'
      # - name: Install
      #   run: |
      #     python -m pip install --upgrade pip
      #     if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
      #     if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      #     pip install pytest
      # - name: Full regression suite
      #   run: pytest
      #<<< STACK:python

      # Go
      #>>> STACK:go
      # - uses: actions/setup-go@v5
      #   with:
      #     go-version: '1.22'
      # - name: Full regression suite
      #   run: go test ./...
      #<<< STACK:go

      # Rust / Cargo
      #>>> STACK:rust
      # - uses: dtolnay/rust-toolchain@stable
      # - name: Full regression suite
      #   run: cargo test
      #<<< STACK:rust

      # Every stack: REQ ledger in the job summary, and fail if a merged REQ-ID has no tests.
      - name: Traceability check
        run: |
          if [ -f scripts/req_status.sh ]; then
            bash scripts/req_status.sh --strict | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "scripts/req_status.sh not found - traceability check skipped"
          fi
