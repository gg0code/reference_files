# CI workflow template.   Kit v2.8
# scaffold.sh activates ONE stack block by removing "# " from the lines between its markers
# (#>>> STACK:<stack> ... #<<< STACK:<stack>) and writes the result to .github/workflows/ci.yml.
# Every stack runs the same gate as loop.sh and pr.sh: bash scripts/gate.sh --full
# (doclint, lint, format, types, tests, coverage floor, dependency audit),
# then a secrets scan and the traceability check (every merged REQ has tests).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: req_status.sh reads commits, gitleaks scans history

      #>>> STACK:python
      # - uses: astral-sh/setup-uv@v6
      # - name: Install (locked)
      #   run: uv sync --locked
      # - name: Full regression suite
      #   run: bash scripts/gate.sh --full
      #<<< STACK:python

      #>>> STACK:node
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: npm
      # - name: Install (locked)
      #   run: npm ci
      # - name: Full regression suite
      #   run: bash scripts/gate.sh --full
      #<<< STACK:node

      #>>> STACK:go
      # - uses: actions/setup-go@v5
      #   with:
      #     go-version: stable
      # - name: Install vulnerability checker
      #   run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # - name: Full regression suite
      #   run: bash scripts/gate.sh --full
      #<<< STACK:go

      #>>> STACK:rust
      # - uses: dtolnay/rust-toolchain@stable
      #   with:
      #     components: rustfmt, clippy
      # - name: Install dependency auditor
      #   run: cargo install cargo-audit --locked
      # - name: Full regression suite
      #   run: bash scripts/gate.sh --full
      #<<< STACK:rust

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisation-owned repos also need GITLEAKS_LICENSE (free for personal accounts).

      - name: Traceability (every merged REQ has tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/req_status.sh --strict
