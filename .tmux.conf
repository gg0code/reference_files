# ~/.tmux.conf  — keyboard-driven, vim-friendly
# Reload after editing with:  prefix + r

# ---------- core ----------
set -g prefix C-a                 # easier reach than C-b
unbind C-b
bind C-a send-prefix              # press twice to send a literal C-a

set -g mouse on                   # click/scroll/resize still work when you want
set -g base-index 1               # windows start at 1
setw -g pane-base-index 0         # panes 0-3: 0 claude · 1 git · 2 test · 3 frontend
set -g renumber-windows on        # keep window numbers gapless
set -g history-limit 50000
set -sg escape-time 0             # no lag on <Esc> (critical for nvim)
set -g focus-events on            # let nvim autoread/autosave hooks fire
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor passthrough (wezterm)

# ---------- reload config ----------
bind r source-file ~/.tmux.conf \; display "  tmux.conf reloaded"

# ---------- splits: intuitive keys, open in current dir ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# ---------- pane navigation: seamless with nvim ----------
# C-h/j/k/l move between tmux panes AND nvim splits transparently.
# (nvim side handled by christoomey/vim-tmux-navigator plugin)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# ---------- resize: repeatable (hold key after prefix) ----------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z          # toggle pane zoom (fullscreen one pane)

# ---------- windows ----------
bind -r n next-window
bind -r p previous-window
bind Tab last-window              # jump back to previous window

# ---------- copy mode: vi keys ----------
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ---------- quality of life ----------
set -g display-time 1500
set -g status-interval 5
setw -g automatic-rename on
set -g set-titles on

# ---------- workspace look: titled panes + green status strip ----------
# Each pane carries three pane options (set by Ctrl-a W, Ctrl-a T or the right-click menu):
#   @role   short name in the status bar        claude
#   @label  title on the pane's top-left border  CLAUDE
#   @desc   what the pane is for (top-right)     SONNET · BUILD
#           (claude pane: kept live by the project's .claude/hooks/tmux-pane.sh - current
#            model from /model, and one stage: PLAN, BUILD or REVIEW)
# Pane options are used instead of the pane title because Claude Code and shells overwrite
# the title. A pane without a role falls back to its running command.
set -g status-position bottom
set -g status-style "bg=#1f8a5b,fg=white"
set -g status-justify centre
set -g status-left-length 120
set -g status-right-length 120
# [session] 0:claude 1:git 2:test 3:frontend   (focused pane in bold)
set -g status-left "#[bold][#S]#[nobold] #{P:#{?pane_active,#[bold],}#{pane_index}:#{?@role,#{@role},#{pane_current_command}}#[nobold] }"
# REQ-014 · gate ✓ green · Ctrl-a z zoom · Ctrl-a d detach
# (tmux-status.sh sits next to the real .tmux.conf, which ~/.tmux.conf links to)
set -g status-right '#(sh "$(dirname "$(readlink -f ~/.tmux.conf)")/tmux-status.sh" "#{pane_current_path}")Ctrl-a z zoom · Ctrl-a d detach '
# window list in the middle; only matters once a second window is open
setw -g window-status-style "fg=white,bg=#1f8a5b"
setw -g window-status-current-style "fg=white,bg=#1f8a5b,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[underscore] #I:#W #[nounderscore]"

# pane borders: grey; the focused pane and its title in green
set -g pane-border-lines single
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=#3fb37f"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#3fb37f#,bold],#[fg=colour245]}#[align=left] #{pane_index} · #{?@label,#{@label},#{pane_current_command}} #[align=right]#{@desc} "

# Ctrl-a W : new window with the 4-pane workspace
#   0 claude (left, 55%) | 1 git / 2 test / 3 frontend (stacked right)
bind W new-window -n work -c "#{pane_current_path}" \; \
  set -p @role claude \; set -p @label CLAUDE \; set -p @desc "CLAUDE NOT RUNNING" \; \
  split-window -h -l 45% -c "#{pane_current_path}" \; \
  set -p @role git \; set -p @label GIT \; set -p @desc "BRANCH · COMMITS · PR" \; \
  split-window -v -l 67% -c "#{pane_current_path}" \; \
  set -p @role test \; set -p @label TEST \; set -p @desc "WATCHER · RE-RUNS ON SAVE" \; \
  split-window -v -l 50% -c "#{pane_current_path}" \; \
  set -p @role frontend \; set -p @label FRONTEND \; set -p @desc "APP RUNNING · LIVE RELOAD" \; \
  select-pane -t 0

# Ctrl-a T : name the focused pane (role, then what it does)
bind T command-prompt -p "role (e.g. claude):,detail (e.g. OPUS · PLAN):" "set -p @role '%1' ; set -p @label '%1' ; set -p @desc '%2'"

# dim inactive panes, highlight the active one
set -g window-style        'fg=colour244,bg=colour234'
set -g window-active-style 'fg=colour252,bg=colour232'

# ---------- right-click pane menu ----------
# Right-click a pane to assign its role/colour, manage layout, or run pane actions.
# Colours apply to the selected pane only; applications such as Claude or Neovim
# may draw their own background and temporarily override the pane colour.
set -g menu-style "fg=white,bg=colour236"
set -g menu-selected-style "fg=black,bg=colour39,bold"
set -g menu-border-style "fg=colour39,bg=colour236"

bind -n MouseDown3Pane display-menu -T "#[align=centre] Pane #{pane_index}: #{pane_title} " -x M -y M \
  "──────── Workspace ────────" "" "" \
  "Claude · purple"       c "select-pane -T 'Claude' -P 'fg=#f5e9ff,bg=#24152f' ; set -p @role claude ; set -p @label CLAUDE ; set -p @desc 'CLAUDE NOT RUNNING'" \
  "Development · blue"    d "select-pane -T 'Development' -P 'fg=#e8f1ff,bg=#10243e' ; set -p @role dev ; set -p @label DEVELOPMENT ; set -p @desc 'EDITOR · BUILD'" \
  "Tests · green"         t "select-pane -T 'Tests' -P 'fg=#e9ffe9,bg=#14301f' ; set -p @role test ; set -p @label TEST ; set -p @desc 'WATCHER · RE-RUNS ON SAVE'" \
  "Git · amber"           g "select-pane -T 'Git' -P 'fg=#fff3d6,bg=#35250d' ; set -p @role git ; set -p @label GIT ; set -p @desc 'BRANCH · COMMITS · PR'" \
  "Frontend · teal"       f "select-pane -T 'Frontend' -P 'fg=#e6fffb,bg=#0f2e2e' ; set -p @role frontend ; set -p @label FRONTEND ; set -p @desc 'APP RUNNING · LIVE RELOAD'" \
  "Logs · red"            l "select-pane -T 'Logs' -P 'fg=#ffecec,bg=#351519' ; set -p @role logs ; set -p @label LOGS ; set -p @desc 'TAIL · ERRORS'" \
  "" "" "" \
  "──────── Layout ──────────" "" "" \
  "Horizontal Split"      h "split-window -h -c '#{pane_current_path}'" \
  "Vertical Split"        v "split-window -v -c '#{pane_current_path}'" \
  "Swap Up"               u "swap-pane -U" \
  "Swap Down"             n "swap-pane -D" \
  "" "" "" \
  "──────── Appearance ──────" "" "" \
  "Blue Pane"             b "select-pane -P 'fg=#e8f1ff,bg=#10243e'" \
  "Green Pane"            e "select-pane -P 'fg=#e9ffe9,bg=#14301f'" \
  "Purple Pane"           p "select-pane -P 'fg=#f5e9ff,bg=#24152f'" \
  "Reset Pane Theme"      0 "select-pane -P 'default'" \
  "" "" "" \
  "──────── Actions ─────────" "" "" \
  "Zoom"                  z "resize-pane -Z" \
  "Respawn"               r "confirm-before -p 'Respawn pane #{pane_index}? (y/n)' 'respawn-pane -k -c #{pane_current_path}'" \
  "Kill"                  X "confirm-before -p 'Kill pane #{pane_index}? (y/n)' 'kill-pane'" \
  "Rename Pane"           R "command-prompt -I '#{@role}' -p 'Pane role:' 'set -p @role %% ; set -p @label %%'"

  run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
