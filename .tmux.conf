# ~/.tmux.conf  — keyboard-driven, vim-friendly, set up for the REVIEW_CODE workflow
# Reload after editing with:  prefix + r
#
# ======================= REVIEW_CODE QUICK KEYS (prefix = Ctrl-a) =======================
#   Ctrl-a W   new "work" window: 0 claude | 1 git / 2 files / 3 test / 4 frontend
#   Ctrl-a V   go to the reviewer window (creates it + starts a read-only Claude if missing)
#   Ctrl-a Tab jump back to the previous window (work <-> review)
#   Ctrl-a F   popup: which files changed (status + diff --stat, incl. untracked ??)
#   Ctrl-a G   popup: full diff of uncommitted work vs last commit (q to close)
#   Ctrl-a B   popup: branch vs main (what this requirement changed once committed)
#   Ctrl-a Y   popup: history - every commit on main with the files it touched
#   Ctrl-a z   zoom the focused pane (read diffs full screen), again to restore
#   Ctrl-a T   name the focused pane      right-click   pane menu (roles, layout, actions)
#   Ctrl-a C-w toggle the focused pane white <-> its own colour   (also Ctrl+right-click)
#   Right-click > Light colours ›  white, mustard, pink, mint, sky, lavender, peach (black text)
# The builder (pane 0) never commits; you read F/G, run tests, review with V, then commit.
# ========================================================================================

# ---------- core ----------
set -g prefix C-a                 # easier reach than C-b
unbind C-b
bind C-a send-prefix              # press twice to send a literal C-a

set -g mouse on                   # click/scroll/resize still work when you want
set -g base-index 1               # windows start at 1
setw -g pane-base-index 0         # panes 0-4: 0 claude · 1 git · 2 files · 3 test · 4 frontend
set -g renumber-windows on        # keep window numbers gapless
set -g history-limit 50000
set -sg escape-time 0             # no lag on <Esc> (critical for nvim)
set -g focus-events on            # let nvim autoread/autosave hooks fire
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor passthrough (wezterm)

# ---------- reload config ----------
bind r source-file ~/.tmux.conf \; display "  tmux.conf reloaded"

# ---------- splits: intuitive keys, open in current dir ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# ---------- pane navigation: seamless with nvim ----------
# C-h/j/k/l move between tmux panes AND nvim splits transparently.
# (nvim side handled by christoomey/vim-tmux-navigator plugin)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# ---------- resize: repeatable (hold key after prefix) ----------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z          # toggle pane zoom (fullscreen one pane)

# ---------- windows ----------
bind -r n next-window
bind -r p previous-window
bind Tab last-window              # jump back to previous window (work <-> review)

# ---------- copy mode: vi keys ----------
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ---------- quality of life ----------
set -g display-time 1500
set -g status-interval 5
setw -g automatic-rename on       # unnamed windows follow their command; named ones (work, review) keep their name
set -g allow-rename off           # programs can't rename windows behind your back
set -g set-titles on

# ---------- workspace look: titled panes + green status strip ----------
# Each pane carries three pane options (set by Ctrl-a W, Ctrl-a T or the right-click menu):
#   @role   short name in the status bar        claude
#   @label  title on the pane's top-left border  CLAUDE
#   @desc   what the pane is for (top-right)     SONNET · BUILD
#           (claude pane: kept live by the project's .claude/hooks/tmux-pane.sh - current
#            model from /model, and one stage: PLAN, BUILD or REVIEW)
# Pane options are used instead of the pane title because Claude Code and shells overwrite
# the title. A pane without a role falls back to its running command.
set -g status-position bottom
set -g status-style "bg=#1f8a5b,fg=white"
set -g status-justify centre
set -g status-left-length 120
set -g status-right-length 160
# [session] 0:claude 1:git 2:files 3:test 4:frontend   (focused pane in bold)
set -g status-left "#[bold][#S]#[nobold] #{P:#{?pane_active,#[bold],}#{pane_index}:#{?@role,#{@role},#{pane_current_command}}#[nobold] }"
# REQ-014 · gate ✓ green · F files · G diff · V review · Ctrl-a z zoom
# (tmux-status.sh sits next to the real .tmux.conf, which ~/.tmux.conf links to)
set -g status-right '#(sh "$(dirname "$(readlink -f ~/.tmux.conf)")/tmux-status.sh" "#{pane_current_path}")F files · G diff · V review · Ctrl-a z zoom '
# window list in the middle: 1:work 2:review
setw -g window-status-style "fg=white,bg=#1f8a5b"
setw -g window-status-current-style "fg=white,bg=#1f8a5b,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[underscore] #I:#W #[nounderscore]"

# pane borders: grey; the focused pane and its title in green
set -g pane-border-lines single
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=#3fb37f"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#3fb37f#,bold],#[fg=colour245]}#[align=left] #{pane_index} · #{?@label,#{@label},#{pane_current_command}} #[align=right]#{@desc} "

# Ctrl-a W : new window with the 5-pane workspace
#   0 claude (left, 55%) | 1 git / 2 files (live changed-files monitor) / 3 test / 4 frontend
#   The files pane refreshes every 5 s (slow /mnt/c filesystem under WSL - lower it on ext4).
bind W new-window -n work -c "#{pane_current_path}" \; \
  set -p @role claude \; set -p @label CLAUDE \; set -p @desc "CLAUDE NOT RUNNING" \; \
  split-window -h -l 45% -c "#{pane_current_path}" \; \
  set -p @role git \; set -p @label GIT \; set -p @desc "BRANCH · DIFF · COMMIT" \; \
  split-window -v -l 55% -c "#{pane_current_path}" \; \
  set -p @role test \; set -p @label TEST \; set -p @desc "WATCHER · RE-RUNS ON SAVE" \; \
  split-window -v -l 50% -c "#{pane_current_path}" \; \
  set -p @role frontend \; set -p @label FRONTEND \; set -p @desc "APP RUNNING · LIVE RELOAD" \; \
  select-pane -t .1 \; \
  split-window -v -l 40% -c "#{pane_current_path}" \; \
  set -p @role files \; set -p @label FILES \; set -p @desc "LIVE · CHANGED FILES" \; \
  send-keys "watch -n 5 'git status -s; echo; git diff --stat HEAD'" Enter \; \
  select-pane -t .0

# Ctrl-a V : reviewer window. Selects it if it exists; otherwise creates it and starts a
#   fresh, read-only Claude (plan mode = cannot edit files). Then type:  /review-req REQ-NN
#   Use /exit and Ctrl-a V again for a fresh reviewer per requirement (kill the window first: Ctrl-a &).
bind V run-shell "tmux select-window -t :review 2>/dev/null || { \
  tmux new-window -n review -c '#{pane_current_path}'; \
  tmux set -p -t :review.0 @role reviewer; \
  tmux set -p -t :review.0 @label REVIEWER; \
  tmux set -p -t :review.0 @desc 'READ-ONLY · PLAN MODE · /review-req REQ-NN'; \
  tmux send-keys -t :review.0 'claude --permission-mode plan' Enter; }"

# ---------- review popups: read changes without leaving the work window ----------
# All open in the focused pane's folder; scroll with j/k/space, q closes.
# Ctrl-a F : which files changed (?? = new file not yet tracked)
bind F display-popup -w 85% -h 80% -d "#{pane_current_path}" -T " changed files (q to close) " \
  -E "{ git -c color.status=always status -s; echo; git diff --stat --color=always HEAD; } | less -R"
# Ctrl-a G : full diff of uncommitted work (staged + unstaged) vs last commit
bind G display-popup -w 95% -h 90% -d "#{pane_current_path}" -T " diff vs last commit (q to close) " \
  -E "git diff --color=always HEAD | less -R"
# Ctrl-a B : this branch vs main (committed work of the current requirement)
bind B display-popup -w 95% -h 90% -d "#{pane_current_path}" -T " branch vs main (q to close) " \
  -E "{ git diff --stat --color=always main...HEAD; echo; git diff --color=always main...HEAD; } | less -R"
# Ctrl-a Y : history - each merged requirement on main with the files it touched
bind Y display-popup -w 90% -h 85% -d "#{pane_current_path}" -T " history: commits + files (q to close) " \
  -E "git log --first-parent --name-status --decorate --color=always main | less -R"

# Ctrl-a T : name the focused pane (role, then what it does)
bind T command-prompt -p "role (e.g. claude):,detail (e.g. OPUS · PLAN):" "set -p @role '%1' ; set -p @label '%1' ; set -p @desc '%2'"

# dim inactive panes, highlight the active one
set -g window-style        'fg=colour244,bg=colour234'
set -g window-active-style 'fg=colour252,bg=colour232'

# ---------- right-click pane menu ----------
# Right-click a pane to assign its role/colour, manage layout, or run pane actions.
# Colours apply to the selected pane only; applications such as Claude or Neovim
# may draw their own background and temporarily override the pane colour.
# Path of tmux-light.sh (next to the real .tmux.conf), stored once for the menu entries below.
run-shell 'tmux set -g @light_sh "$(dirname "$(readlink -f ~/.tmux.conf)")/tmux-light.sh"'
set -g menu-style "fg=white,bg=colour236"
set -g menu-selected-style "fg=black,bg=colour39,bold"
set -g menu-border-style "fg=colour39,bg=colour236"

bind -n MouseDown3Pane display-menu -T "#[align=centre] Pane #{pane_index}: #{?@role,#{@role},#{pane_current_command}} " -x M -y M \
  "──────── Workspace ────────" "" "" \
  "Claude · purple"       c "select-pane -T 'Claude' -P 'fg=#f5e9ff,bg=#24152f' ; set -p @role claude ; set -p @label CLAUDE ; set -p @desc 'CLAUDE NOT RUNNING'" \
  "Reviewer · orange"     w "select-pane -T 'Reviewer' -P 'fg=#fff0e3,bg=#33200f' ; set -p @role reviewer ; set -p @label REVIEWER ; set -p @desc 'READ-ONLY · PLAN MODE · /review-req REQ-NN'" \
  "Development · blue"    d "select-pane -T 'Development' -P 'fg=#e8f1ff,bg=#10243e' ; set -p @role dev ; set -p @label DEVELOPMENT ; set -p @desc 'EDITOR · BUILD'" \
  "Tests · green"         t "select-pane -T 'Tests' -P 'fg=#e9ffe9,bg=#14301f' ; set -p @role test ; set -p @label TEST ; set -p @desc 'WATCHER · RE-RUNS ON SAVE'" \
  "Git · amber"           g "select-pane -T 'Git' -P 'fg=#fff3d6,bg=#35250d' ; set -p @role git ; set -p @label GIT ; set -p @desc 'BRANCH · DIFF · COMMIT'" \
  "Files monitor · grey"  i "select-pane -T 'Files' -P 'fg=#e6e6e6,bg=#1c1c1c' ; set -p @role files ; set -p @label FILES ; set -p @desc 'LIVE · CHANGED FILES' ; send-keys \"watch -n 5 'git status -s; echo; git diff --stat HEAD'\" Enter" \
  "Frontend · teal"       f "select-pane -T 'Frontend' -P 'fg=#e6fffb,bg=#0f2e2e' ; set -p @role frontend ; set -p @label FRONTEND ; set -p @desc 'APP RUNNING · LIVE RELOAD'" \
  "Logs · red"            l "select-pane -T 'Logs' -P 'fg=#ffecec,bg=#351519' ; set -p @role logs ; set -p @label LOGS ; set -p @desc 'TAIL · ERRORS'" \
  "" "" "" \
  "──────── Review ──────────" "" "" \
  "Changed files"         F "display-popup -w 85% -h 80% -d '#{pane_current_path}' -E \"{ git -c color.status=always status -s; echo; git diff --stat --color=always HEAD; } | less -R\"" \
  "Full diff"             G "display-popup -w 95% -h 90% -d '#{pane_current_path}' -E \"git diff --color=always HEAD | less -R\"" \
  "" "" "" \
  "──────── Layout ──────────" "" "" \
  "Horizontal Split"      h "split-window -h -c '#{pane_current_path}'" \
  "Vertical Split"        v "split-window -v -c '#{pane_current_path}'" \
  "Swap Up"               u "swap-pane -U" \
  "Swap Down"             n "swap-pane -D" \
  "" "" "" \
  "──────── Appearance ──────" "" "" \
  "Blue Pane"             b "select-pane -P 'fg=#e8f1ff,bg=#10243e'" \
  "Green Pane"            e "select-pane -P 'fg=#e9ffe9,bg=#14301f'" \
  "Purple Pane"           p "select-pane -P 'fg=#f5e9ff,bg=#24152f'" \
  "Reset Pane Theme"      0 "select-pane -P 'default'" \
  "White ⇄ Colour"        W "run-shell 'sh #{@light_sh} #{pane_id} white'" \
  "Light colours ›"       C "display-menu -T '#[align=centre] Light · black text ' -x M -y M \
      'White ⇄ Colour'     W 'run-shell \"sh #{@light_sh} #{pane_id} white\"' \
      'Mustard ⇄ Colour'   M 'run-shell \"sh #{@light_sh} #{pane_id} mustard\"' \
      'Pink ⇄ Colour'      P 'run-shell \"sh #{@light_sh} #{pane_id} pink\"' \
      'Mint ⇄ Colour'      T 'run-shell \"sh #{@light_sh} #{pane_id} mint\"' \
      'Sky ⇄ Colour'       S 'run-shell \"sh #{@light_sh} #{pane_id} sky\"' \
      'Lavender ⇄ Colour'  L 'run-shell \"sh #{@light_sh} #{pane_id} lavender\"' \
      'Peach ⇄ Colour'     H 'run-shell \"sh #{@light_sh} #{pane_id} peach\"'" \
  "" "" "" \
  "──────── Actions ─────────" "" "" \
  "Zoom"                  z "resize-pane -Z" \
  "Respawn"               r "confirm-before -p 'Respawn pane #{pane_index}? (y/n)' 'respawn-pane -k -c #{pane_current_path}'" \
  "Kill"                  X "confirm-before -p 'Kill pane #{pane_index}? (y/n)' 'kill-pane'" \
  "Rename Pane"           R "command-prompt -I '#{@role}' -p 'Pane role:' 'set -p @role %% ; set -p @label %%'"

# ---------- white pane toggle ----------
# Flip one pane to black-on-white and back to the colour it had (tmux-light.sh sits next to
# the real .tmux.conf, like tmux-status.sh). Ctrl+right-click the pane, or Ctrl-a C-w.
bind -n C-MouseDown3Pane run-shell -t= 'sh "$(dirname "$(readlink -f ~/.tmux.conf)")/tmux-light.sh" #{pane_id}'
bind C-w run-shell 'sh "$(dirname "$(readlink -f ~/.tmux.conf)")/tmux-light.sh" #{pane_id}'

bind B display-popup -w 95% -h 90% -d "#{pane_current_path}" -T " branch vs main (q to close) " \
  -E "git diff --stat main...HEAD; echo; git diff --color=always --color-moved=zebra main...HEAD | less -R"
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
