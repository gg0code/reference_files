# .github/workflows/ci.yml
# Runs the FULL pytest suite on every PR and every push to main.
# A branch suite proves the new REQ works; the full suite proves the earlier ones still do.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full regression suite
        run: pytest
