# Save as .github/workflows/ci.yml in the project repo.
# Makes "tests pass" a mechanical gate instead of something you remember to check.
#
# GENERIC TEMPLATE — works for any project.
# Pick ONE stack block below, uncomment it, and delete or leave the others commented.
# The philosophy is identical for every stack: run the FULL regression suite on
# every PR and every push to main, never filtered to just the new tests.
# A branch suite proves the new REQ works; only the full suite proves the earlier
# REQ-IDs still work.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # =====================================================================
      # Node / npm   (default — comment this block out if it is not your stack)
      # =====================================================================
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Full regression suite
        run: npm test

      # =====================================================================
      # Python / pytest   (uncomment to use)
      # =====================================================================
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      #     cache: 'pip'
      # - name: Install
      #   run: pip install -r requirements.txt
      # - name: Full regression suite
      #   run: pytest

      # =====================================================================
      # Go   (uncomment to use)
      # =====================================================================
      # - uses: actions/setup-go@v5
      #   with:
      #     go-version: '1.22'
      # - name: Full regression suite
      #   run: go test ./...

      # =====================================================================
      # Rust / Cargo   (uncomment to use)
      # =====================================================================
